title: SolidBinary
tagline: "Build Intelligent. Build Solid."
description: "SolidBinary is a founder-led practice that builds AI agents for sales, support and back-office work, for small and mid-sized companies in India and internationally."
url: "https://solidbinary.com"
baseurl: ""
lang: en

# ---- Contact settings (edit these) ---------------------------------------
# Booking link for "Book a call" buttons. Leave empty to hide booking buttons.
booking_url: "https://calendar.google.com/calendar/appointments/schedules/AcZssZ02uwNlaJ1LZ0Q9cR4TFGhwuQkooj1ccM2wgUEnIRYDu5NZaGpNuccjFVIl97VnO7V7oHqrtF_A"
# Google Apps Script web app URL that receives the contact form
# (adds a row to the "SolidBinary Website Inquiries" Google Sheet and emails you).
# Leave empty to hide the form.
form_endpoint: "https://script.google.com/macros/s/AKfycbw220tPfYmR6fEtrO_Km6aCKwjqffsItWIclJARuqMAuxouVPoe1zdcxWC-JHCD4Ak4/exec"
# Optional social links
linkedin_url: "https://www.linkedin.com/in/billuyadav/"

# Starting price for the AI Opportunity Assessment, shown on its page and the
# homepage, e.g. "From ₹1.5 lakh / US$2,000". Leave empty to show
# "Fixed price, agreed after the free call".
assessment_price: ""

# Analytics. Fill in ONE of these to turn tracking on (both empty = no tracking).
# Plausible needs no cookie banner; GA4 is free but sets cookies.
# Events sent: book_call_click, inquiry_submitted, inquiry_failed.
analytics:
  plausible_domain: ""   # e.g. "solidbinary.com"
  ga4_id: ""             # e.g. "G-XXXXXXXXXX"
# --------------------------------------------------------------------------

# Default social preview image and logo (used by jekyll-seo-tag and schema)
image: /assets/img/og-default.png
logo: /assets/img/logo-square.png
social:
  name: Billu Yadav
  links:
    - "https://www.linkedin.com/in/billuyadav/"
author:
  name: Billu Yadav
  url: "https://billuyadav.com/"

permalink: /insights/:year/:month/:title/
timezone: Asia/Kolkata

collections:
  services:
    output: true
    permalink: /services/:name/

defaults:
  - scope: { path: "", type: services }
    values: { layout: service }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: insights/feed.xml

exclude:
  - README.md
  - design.md
  - Gemfile
  - Gemfile.lock
  - vendor
