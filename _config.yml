# --------------------------------------------------------------------------

permalink: /insights/:year/:month/:title/
timezone: Asia/Kolkata

collections:
  services:
    output: true
    permalink: /services/:name/

defaults:
  - scope: { path: "", type: services }
    values: { layout: service }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: insights/feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
