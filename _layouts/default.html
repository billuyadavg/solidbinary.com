<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <script>(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t){localStorage.setItem('sb-theme',t)}t=t||localStorage.getItem('sb-theme');if(t==='dark'){document.documentElement.removeAttribute('data-theme')}}catch(e){}})();</script>
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% seo %}
  {% feed_meta %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"ProfessionalService","name":"SolidBinary","url":{{ site.url | jsonify }},"logo":{{ site.logo | absolute_url | jsonify }},"image":{{ site.image | absolute_url | jsonify }},"description":{{ site.description | jsonify }},"founder":{"@type":"Person","name":"Billu Yadav","url":"https://billuyadav.com/"},"address":{"@type":"PostalAddress","addressLocality":"Jaipur","addressRegion":"Rajasthan","addressCountry":"IN"},"areaServed":["India","Worldwide"],"sameAs":[{{ site.linkedin_url | jsonify }}],"knowsAbout":["AI agents","Agentic AI","Business process automation","Retrieval-augmented generation","Software engineering"]}
  </script>
  {% if site.analytics.plausible_domain and site.analytics.plausible_domain != "" %}
  <script defer data-domain="{{ site.analytics.plausible_domain }}" src="https://plausible.io/js/script.js"></script>
  <script>window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)}</script>
  {% endif %}
  {% if site.analytics.ga4_id and site.analytics.ga4_id != "" %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.ga4_id }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ site.analytics.ga4_id }}');</script>
  {% endif %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
