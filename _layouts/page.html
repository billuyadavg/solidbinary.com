---
layout: default
---
{% if page.hero_title %}
<section class="page-hero">
  <div class="container narrow">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.hero_title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>
{% endif %}
{{ content }}
