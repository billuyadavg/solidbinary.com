- short: Free call
  title: Free 30-minute call
  text: Your goals, current tools, and where time is lost. No cost, no obligation.
- short: Assessment
  title: AI Opportunity Assessment (about 2 weeks, fixed price)
  text: Interviews with the people doing the work, a review of systems and data, and a ranked shortlist with a recommended first pilot.
- short: Pilot
  title: Pilot (typically 3–6 weeks)
  text: One workflow built on your real data and measured against the baseline agreed in the assessment.
- short: Decide
  title: Roll out or stop
  text: If the numbers hold, we take it live and add the next workflow. If they don't, you have a clear answer and nothing left half-built.
- short: Agent care
  title: Agent care (monthly)
  text: Monitoring, evaluation, updates and a monthly report.
